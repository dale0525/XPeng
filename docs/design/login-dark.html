<script>
    // Lightweight micro-interaction for verification code counter
    const smsBtn = document.getElementById('sms-trigger');
    const phoneInput = document.getElementById('phone-input');
    
    if (smsBtn) {
      smsBtn.addEventListener('click', () => {
        const val = phoneInput.value.trim();
        if (val.length < 11) {
          phoneInput.focus();
          phoneInput.classList.add('border-primary-container');
          setTimeout(() => phoneInput.classList.remove('border-primary-container'), 800);
          return;
        }

        let seconds = 60;
        smsBtn.disabled = true;
        smsBtn.classList.add('opacity-50', 'cursor-not-allowed');
        
        const updateText = () => {
          smsBtn.innerHTML = `<span>重新获取 (${seconds}s)</span>`;
        };
        
        updateText();
        const timer = setInterval(() => {
          seconds--;
          if (seconds <= 0) {
            clearInterval(timer);
            smsBtn.disabled = false;
            smsBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            smsBtn.innerHTML = `<span>获取验证码</span>`;
          } else {
            updateText();
          }
        }, 1000);
      });
    }
  </script>
