<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-canvas-dark text-text-main font-body antialiased m-0 p-0 overflow-hidden w-full h-screen min-h-screen relative flex flex-col justify-end">
<!-- Fullscreen Dimmed Modal Backdrop -->
<div aria-hidden="true" class="fixed inset-0 bg-black/60 z-0 pointer-events-auto"></div>
<!-- Bottom Sheet Modal (Strictly docked bottom, 100% full width, edge-to-edge) -->
<aside class="relative z-10 w-full bg-surface-dark rounded-t-[28px] border-t border-hairline-dark flex flex-col shadow-2xl transition-transform duration-300">
<!-- Drag Handle -->
<div aria-hidden="true" class="w-full flex justify-center pt-3 pb-1">
<div class="w-9 h-1 rounded-full bg-hairline-card"></div>
</div>
<!-- Modal Header -->
<header class="flex justify-between items-center px-6 pt-3 pb-2">
<h1 class="font-headline text-[20px] font-semibold text-text-main tracking-tight leading-snug">
        直线召唤
      </h1>
<button aria-label="关闭" class="w-9 h-9 rounded-full bg-surface-inset border border-hairline-card flex items-center justify-center text-text-sub active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</header>
<!-- Status Section (Pre-check) -->
<section class="rounded-[22px] bg-ink-block border border-hairline-card p-4 mx-6 my-2">
<!-- Row 1 -->
<div class="flex items-center justify-between pb-3">
<span class="text-text-sub text-[14px] font-normal leading-tight">蓝牙通道</span>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-positive-green shrink-0"></span>
<span class="text-text-main text-[14px] font-medium leading-tight">已连接</span>
</div>
</div>
<!-- Hairline divider -->
<div class="h-px w-full bg-hairline-card/60"></div>
<!-- Row 2 -->
<div class="flex items-center justify-between pt-3">
<span class="text-text-sub text-[14px] font-normal leading-tight">当前通道</span>
<span class="text-text-main text-[14px] font-semibold leading-tight font-headline">蓝牙</span>
</div>
</section>
<!-- Direction Controls -->
<div class="mx-6 mt-2 flex flex-col items-center">
<!-- Button: Forward -->
<button class="w-full h-[56px] rounded-full bg-accent-volt text-canvas-dark font-semibold text-base flex items-center justify-center gap-2 active:scale-[0.98] transition-transform select-none shadow-none focus:outline-none" id="btn-forward" type="button">
<span class="font-headline font-bold text-lg leading-none">↑</span>
<span class="font-headline font-semibold tracking-wide">向前</span>
</button>
<!-- Helper caption -->
<p class="text-center text-xs text-text-sub font-normal my-2 select-none">
        按住不放，松开即停
      </p>
<!-- Button: Backward -->
<button class="w-full h-[56px] rounded-full bg-accent-volt text-canvas-dark font-semibold text-base flex items-center justify-center gap-2 active:scale-[0.98] transition-transform select-none shadow-none focus:outline-none" id="btn-backward" type="button">
<span class="font-headline font-bold text-lg leading-none">↓</span>
<span class="font-headline font-semibold tracking-wide">向后</span>
</button>
</div>
<!-- Status Readout (Dual Card/Grid) -->
<div class="mx-6 mt-4 grid grid-cols-2 gap-3">
<!-- Left Box -->
<div class="rounded-[18px] bg-surface-inset p-3.5 border border-hairline-dark/40 flex flex-col justify-between">
<span class="text-xs text-text-sub leading-none mb-1.5 font-normal">车辆状态</span>
<span class="text-base font-semibold text-text-main font-headline leading-snug tabular-nums">—</span>
</div>
<!-- Right Box -->
<div class="rounded-[18px] bg-surface-inset p-3.5 border border-hairline-dark/40 flex flex-col justify-between">
<span class="text-xs text-text-sub leading-none mb-1.5 font-normal">召唤状态</span>
<span class="text-base font-semibold text-text-main font-headline leading-snug tabular-nums">—</span>
</div>
</div>
<!-- Bottom Action -->
<div class="mx-6 mt-4 mb-2">
<button class="w-full h-[52px] rounded-full bg-surface-inset border border-hairline-card/70 text-text-main font-medium text-sm flex items-center justify-center active:scale-[0.98] transition-all select-none" type="button">
        退出召唤
      </button>
</div>
<!-- Bottom Home Indicator Bar (iOS style safe margin anchor) -->
<div aria-hidden="true" class="w-full flex justify-center pt-2 pb-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
<div class="w-32 h-1 bg-[#4A4D53] rounded-full"></div>
</div>
</aside>
<script>
    // Micro-interactions for touch & hold on direction buttons
    const bindHoldFeedback = (id) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      const startHold = () => {
        btn.classList.add('opacity-90', 'scale-[0.97]');
      };
      const endHold = () => {
        btn.classList.remove('opacity-90', 'scale-[0.97]');
      };
      btn.addEventListener('touchstart', startHold, { passive: true });
      btn.addEventListener('touchend', endHold, { passive: true });
      btn.addEventListener('touchcancel', endHold, { passive: true });
      btn.addEventListener('mousedown', startHold);
      btn.addEventListener('mouseup', endHold);
      btn.addEventListener('mouseleave', endHold);
    };

    bindHoldFeedback('btn-forward');
    bindHoldFeedback('btn-backward');
  </script>
</body></html>
