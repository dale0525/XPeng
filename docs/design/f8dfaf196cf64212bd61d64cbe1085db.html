<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车控快捷指令 - 1x4 桌面小组件 (Volt Lime 暗色)</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', '"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0E0F11;
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
    }
  </style>
</head>
<body class="w-full min-h-screen bg-[#0E0F11] flex items-center justify-center p-4 select-none">

  <!-- 1x4 Android Widget Container (约 640px 等比长条，纯净桌面小组件本体) -->
  <div class="w-full max-w-[640px] bg-[#1B1D20] border border-[#2E3035] rounded-[28px] px-4 py-3 shadow-[0_12px_36px_rgba(0,0,0,0.6)]">
    <!-- 一行 4 格等宽横向排列 -->
    <div class="grid grid-cols-4 gap-3 items-center">
      
      <!-- 项 1: 解锁 -->
      <button type="button" class="group flex flex-col items-center justify-center p-2 rounded-2xl transition-all duration-150 active:scale-95 hover:bg-[#25282D]/50 focus:outline-none cursor-pointer">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] border border-[#3E4044] flex items-center justify-center text-[#F5F6F7] shadow-sm group-hover:bg-[#3D3F42] transition-colors">
          <span class="material-symbols-outlined">lock_open</span>
        </div>
        <span class="mt-2 text-[13px] font-medium text-[#F5F6F7] tracking-tight leading-tight">解锁</span>
      </button>

      <!-- 项 2: 远程解锁 -->
      <button type="button" class="group flex flex-col items-center justify-center p-2 rounded-2xl transition-all duration-150 active:scale-95 hover:bg-[#25282D]/50 focus:outline-none cursor-pointer">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] border border-[#3E4044] flex items-center justify-center text-[#F5F6F7] shadow-sm group-hover:bg-[#3D3F42] transition-colors">
          <span class="material-symbols-outlined">vpn_key</span>
        </div>
        <span class="mt-2 text-[13px] font-medium text-[#F5F6F7] tracking-tight leading-tight">远程解锁</span>
      </button>

      <!-- 项 3: 开启空调 -->
      <button type="button" class="group flex flex-col items-center justify-center p-2 rounded-2xl transition-all duration-150 active:scale-95 hover:bg-[#25282D]/50 focus:outline-none cursor-pointer">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] border border-[#3E4044] flex items-center justify-center text-[#F5F6F7] shadow-sm group-hover:bg-[#3D3F42] transition-colors">
          <span class="material-symbols-outlined">ac_unit</span>
        </div>
        <span class="mt-2 text-[13px] font-medium text-[#F5F6F7] tracking-tight leading-tight">开启空调</span>
      </button>

      <!-- 项 4: 闪灯 -->
      <button type="button" class="group flex flex-col items-center justify-center p-2 rounded-2xl transition-all duration-150 active:scale-95 hover:bg-[#25282D]/50 focus:outline-none cursor-pointer">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] border border-[#3E4044] flex items-center justify-center text-[#F5F6F7] shadow-sm group-hover:bg-[#3D3F42] transition-colors">
          <span class="material-symbols-outlined">highlight</span>
        </div>
        <span class="mt-2 text-[13px] font-medium text-[#F5F6F7] tracking-tight leading-tight">闪灯</span>
      </button>

    </div>
  </div>

</body>
</html>
