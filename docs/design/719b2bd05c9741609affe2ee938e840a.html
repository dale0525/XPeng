<!DOCTYPE html>

<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="flex justify-center items-center min-h-screen">
<!-- Mobile Viewport Canvas (Strictly 390px Width Container) -->
<main class="relative w-[390px] h-[844px] max-h-[884px] bg-[#F2F2F4] overflow-hidden flex flex-col justify-end select-none">
<!-- Uniform Clean Backdrop Dimming Overlay (No underlying cards, data, or texts permitted) -->
<div class="absolute inset-0 bg-black/45 z-10 pointer-events-none"></div>
<!-- Bottom Sheet Component (White Card #FFFFFF, Top Radius 28px) -->
<section class="relative z-20 w-full bg-[#FFFFFF] rounded-t-[28px] pt-3 px-6 pb-2 flex flex-col shadow-2xl">
<!-- Drag Handle Indicator (40px x 4px) -->
<div class="flex justify-center w-full pt-1 pb-3">
<div class="w-10 h-1 bg-[#EDEDEF] rounded-full"></div>
</div>
<!-- Header: Title & Circular Close Button -->
<header class="flex items-center justify-between pt-1 pb-5">
<h1 class="font-headline font-semibold text-[20px] leading-tight text-[#111214] tracking-tight">
          连接充电桩
        </h1>
<button aria-label="关闭" class="w-9 h-9 rounded-full bg-[#EDEDEF] flex items-center justify-center text-[#111214] hover:bg-[#E2E2E5] active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</header>
<!-- Charger Information Section (Read-only Card, Background #EDEDEF, Radius 22px) -->
<div class="bg-[#EDEDEF] rounded-[22px] px-5 py-1 mb-3">
<!-- 充电桩名称 -->
<div class="flex items-center justify-between py-3.5 border-b border-[#E1E2E6]">
<span class="font-body text-[14px] text-[#8A8D93]">充电桩名称</span>
<span class="font-headline font-medium text-[15px] text-[#111214] tabular-nums">—</span>
</div>
<!-- 连接状态 -->
<div class="flex items-center justify-between py-3.5 border-b border-[#E1E2E6]">
<span class="font-body text-[14px] text-[#8A8D93]">连接状态</span>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-[#12CE86]"></span>
<span class="font-body font-medium text-[14px] text-[#111214]">已连接</span>
</div>
</div>
<!-- 充电桩编号 -->
<div class="flex items-center justify-between py-3.5">
<span class="font-body text-[14px] text-[#8A8D93]">充电桩编号</span>
<span class="font-headline font-medium text-[15px] text-[#111214] tabular-nums">—</span>
</div>
</div>
<!-- Charging Status Card (Read-only, Radius 22px) -->
<div class="bg-[#EDEDEF] rounded-[22px] px-5 py-3.5 flex items-center justify-between mb-5">
<span class="font-body text-[14px] text-[#8A8D93]">可充电状态</span>
<span class="font-body font-semibold text-[14px] text-[#111214]">可充电</span>
</div>
<!-- Primary Action Button: 启动充电 (Height 52px, Rounded Full, Lemon Yellow #F4EF00, No Shadow) -->
<button class="w-full h-[52px] rounded-full bg-[#F4EF00] text-[#111214] font-headline font-semibold text-[16px] flex items-center justify-center gap-2 active:scale-[0.98] transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="bolt">bolt</span>
<span>启动充电</span>
</button>
<!-- Explanatory Footnote -->
<p class="text-center font-body text-[12px] text-[#8A8D93] mt-3 mb-2">
        连接后可在车旁启动充电
      </p>
<!-- Bottom Safe Area Indicator (Home Indicator) -->
<div class="w-full flex justify-center pt-2 pb-1">
<div class="w-32 h-1 bg-[#111214] rounded-full opacity-20"></div>
</div>
</section>
</main>
</body></html>
