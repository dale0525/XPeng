<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车控快捷指令 - 2x2 桌面小组件 (Volt Lime 暗色)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            headline: ['Space Grotesk', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            'volt-lime': '#E8E400',
            'widget-bg': '#1B1D20',
            'widget-border': '#2E3035',
            'cell-bg': '#26282C',
            'icon-circle': '#343537',
            'text-primary': '#F5F6F7',
          }
        }
      }
    }
  </script>
  <style>
    /* Material Symbols Outlined standard styling */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: 300;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-[#0E0F11] min-h-screen w-full flex items-center justify-center p-0 m-0 font-body select-none antialiased">

  <!-- Android 2x2 Widget Canvas: 320px x 320px -->
  <div class="relative w-[320px] h-[320px] bg-[#1B1D20] rounded-[28px] border border-[#2E3035] p-4 box-border shadow-2xl flex flex-col justify-between overflow-hidden">
    
    <!-- 2x2 Grid Container: gap 12px, equal width and height -->
    <div class="grid grid-cols-2 grid-rows-2 gap-3 w-full h-full">
      
      <!-- Cell 1: 解锁 (lock_open) -->
      <button type="button" class="w-full h-full bg-[#26282C] rounded-[22px] flex flex-col items-center justify-center gap-2.5 transition-all duration-150 active:scale-95 active:bg-[#2F3238] focus:outline-none group">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] flex items-center justify-center text-[#F5F6F7] transition-colors group-hover:bg-[#3D3F42]">
          <span class="material-symbols-outlined text-[24px]">lock_open</span>
        </div>
        <span class="text-[13px] font-medium text-[#F5F6F7] leading-none tracking-tight">解锁</span>
      </button>

      <!-- Cell 2: 远程解锁 (vpn_key) -->
      <button type="button" class="w-full h-full bg-[#26282C] rounded-[22px] flex flex-col items-center justify-center gap-2.5 transition-all duration-150 active:scale-95 active:bg-[#2F3238] focus:outline-none group">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] flex items-center justify-center text-[#F5F6F7] transition-colors group-hover:bg-[#3D3F42]">
          <span class="material-symbols-outlined text-[24px]">vpn_key</span>
        </div>
        <span class="text-[13px] font-medium text-[#F5F6F7] leading-none tracking-tight">远程解锁</span>
      </button>

      <!-- Cell 3: 开启空调 (ac_unit) -->
      <button type="button" class="w-full h-full bg-[#26282C] rounded-[22px] flex flex-col items-center justify-center gap-2.5 transition-all duration-150 active:scale-95 active:bg-[#2F3238] focus:outline-none group">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] flex items-center justify-center text-[#F5F6F7] transition-colors group-hover:bg-[#3D3F42]">
          <span class="material-symbols-outlined text-[24px]">ac_unit</span>
        </div>
        <span class="text-[13px] font-medium text-[#F5F6F7] leading-none tracking-tight">开启空调</span>
      </button>

      <!-- Cell 4: 闪灯 (highlight) -->
      <button type="button" class="w-full h-full bg-[#26282C] rounded-[22px] flex flex-col items-center justify-center gap-2.5 transition-all duration-150 active:scale-95 active:bg-[#2F3238] focus:outline-none group">
        <div class="w-[44px] h-[44px] rounded-full bg-[#343537] flex items-center justify-center text-[#F5F6F7] transition-colors group-hover:bg-[#3D3F42]">
          <span class="material-symbols-outlined text-[24px]">highlight</span>
        </div>
        <span class="text-[13px] font-medium text-[#F5F6F7] leading-none tracking-tight">闪灯</span>
      </button>

    </div>

  </div>

</body>
</html>
