<!DOCTYPE html>

<html class="h-full" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>小鹏车控 - 登录</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;800;900&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#FFFFFF",
            "surface-dim": "#F4F1EA",
            "surface-bright": "#FFFFFF",
            "surface-container-lowest": "#FFFFFF",
            "surface-container-low": "#F8F5EF",
            "surface-container": "#F1ECE2",
            "surface-container-high": "#E9E2D4",
            "surface-container-highest": "#E0D8C7",
            "on-surface": "#1C1A15",
            "on-surface-variant": "#5C5442",
            "inverse-surface": "#1C1A15",
            "inverse-on-surface": "#F4F1EA",
            "outline": "#8A7F68",
            "outline-variant": "#D6CCB8",
            "surface-tint": "#B37400",
            "primary": "#8A5A00",
            "primary-amber": "#B37400",
            "on-primary": "#FFFFFF",
            "primary-container": "#FFB703",
            "on-primary-container": "#3A2600",
            "secondary": "#00626D",
            "secondary-dark": "#007A87",
            "background": "#F8F5EF",
            "on-background": "#1C1A15"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "2xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Anybody", "sans-serif"],
            "display": ["Anybody", "sans-serif"],
            "body": ["Space Grotesk", "sans-serif"],
            "mono": ["Space Mono", "monospace"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8F5EF;
      color: #1C1A15;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 450, 'GRAD' 0, 'opsz' 24;
    }
    .inset-recessed {
      box-shadow: inset 0 2px 4px rgba(28, 26, 21, 0.05), 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    .card-plate {
      box-shadow: 0 4px 20px -3px rgba(28, 26, 21, 0.07), 0 1px 3px rgba(28, 26, 21, 0.04);
    }
    .primary-shadow {
      box-shadow: 0 6px 18px -2px rgba(179, 116, 0, 0.35);
    }
    .slant-badge {
      transform: skewX(-8deg);
    }
    .unslant {
      transform: skewX(8deg);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full w-full overflow-hidden select-none bg-background text-on-surface">
<!-- Main Viewport Container (Filled 100vh / Full Mobile Viewport) -->
<main class="w-full h-full min-h-screen flex flex-col justify-between px-6 pt-2 pb-6 max-w-[430px] mx-auto box-border relative">
<!-- Top Decorative Horizon Line Overlay -->
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-[#B37400]/40 to-transparent pointer-events-none"></div>
<!-- Group: Status Bar + Brand Header + Form Area -->
<div class="w-full flex flex-col">
<!-- Android Standard Status Bar -->
<div class="w-full h-8 flex items-center justify-between text-on-surface-variant font-mono text-[13px] tracking-tight mb-4 px-0.5">
<span class="font-bold text-on-surface text-[14px]">9:41</span>
<div class="flex items-center space-x-1.5 opacity-90">
<span class="material-symbols-outlined text-[17px]">wifi</span>
<span class="material-symbols-outlined text-[17px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[19px] rotate-90">battery_full</span>
</div>
</div>
<!-- App Brand & Identity Cluster -->
<section class="mt-2 mb-7">
<div class="flex items-center space-x-3.5">
<!-- Geometric XPENG-Inspired Telematics Emblem -->
<div class="w-12 h-12 rounded-xl bg-surface border border-outline-variant flex items-center justify-center relative overflow-hidden card-plate flex-shrink-0">
<!-- Horizon Speed Stripes Accents -->
<div class="absolute top-0 right-0 w-8 h-1 bg-[#B37400]"></div>
<div class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center border border-outline-variant/60">
<span class="material-symbols-outlined text-[#B37400] text-[22px] fill-1" data-icon="electric_car">electric_car</span>
</div>
</div>
<div class="flex flex-col">
<div class="flex items-center space-x-2">
<h1 class="font-headline font-black text-[23px] tracking-tight text-on-surface leading-tight">
                小鹏车控
              </h1>
<!-- Telematics Tag Badge -->
<span class="slant-badge inline-flex items-center px-1.5 py-0.5 bg-[#B37400]/10 border border-[#B37400]/30 rounded">
<span class="unslant font-mono text-[9px] font-bold text-[#8A5A00] tracking-wider uppercase">TELEMATICS</span>
</span>
</div>
<div class="mt-1 flex items-center space-x-1.5">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-[#007A87]"></span>
<p class="font-body text-[12px] font-medium text-on-surface-variant tracking-normal">
                非官方自研客户端
              </p>
</div>
</div>
</div>
</section>
<!-- Core Form Card Container -->
<section class="bg-surface rounded-2xl border border-outline-variant/80 p-5 card-plate relative overflow-hidden">
<!-- Subtle Top Edge Technical Ruler Accent -->
<div class="absolute top-0 left-5 right-5 h-[1.5px] bg-[#B37400]/25"></div>
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Field 1: Phone Input -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-body text-[13px] font-semibold text-on-surface-variant flex items-center space-x-1" for="phone-input">
<span>手机号</span>
</label>
<span class="font-mono text-[10px] text-outline font-medium">CHN MOBILE</span>
</div>
<div class="w-full h-12 bg-surface-container-low rounded-xl border border-outline-variant flex items-center px-3.5 focus-within:border-[#B37400] focus-within:bg-surface transition-all inset-recessed">
<div class="flex items-center space-x-1 pr-2.5 mr-2.5 border-r border-outline-variant/80 text-on-surface flex-shrink-0">
<span class="font-mono text-[14px] font-bold tracking-tight text-[#8A5A00]">+86</span>
<span class="material-symbols-outlined text-[16px] text-outline">arrow_drop_down</span>
</div>
<input class="w-full bg-transparent border-0 p-0 text-[15px] font-mono text-on-surface placeholder:text-outline/70 placeholder:font-body focus:ring-0 focus:outline-none tracking-wide" id="phone-input" inputmode="numeric" maxlength="11" pattern="[0-9]*" placeholder="请输入 11 位手机号" type="tel"/>
</div>
</div>
<!-- Field 2: Verification Code Input -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-body text-[13px] font-semibold text-on-surface-variant flex items-center space-x-1" for="code-input">
<span>验证码</span>
</label>
<span class="font-mono text-[10px] text-outline font-medium">ONE-TIME CODE</span>
</div>
<div class="w-full h-12 bg-surface-container-low rounded-xl border border-outline-variant flex items-center pl-3.5 pr-1.5 focus-within:border-[#B37400] focus-within:bg-surface transition-all inset-recessed">
<input class="w-full bg-transparent border-0 p-0 text-[15px] font-mono text-on-surface placeholder:text-outline/70 placeholder:font-body focus:ring-0 focus:outline-none tracking-widest" id="code-input" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="请输入 6 位验证码" type="number"/>
<!-- Get Code Button (High Clarity Daylight Accent) -->
<button class="h-9 px-3 rounded-lg bg-surface border border-[#B37400]/40 text-[#8A5A00] font-body text-[12px] font-semibold hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center flex-shrink-0 whitespace-nowrap shadow-sm" id="code-btn" onclick="handleGetCode(this)" type="button">
                获取验证码
              </button>
</div>
</div>
<!-- Action Buttons Area -->
<div class="pt-2 space-y-3">
<!-- Primary Action: Login (Amber Sun Warmth Tone #B37400) -->
<button class="w-full h-12 rounded-xl bg-[#B37400] hover:bg-[#8A5A00] active:scale-[0.98] text-on-primary font-headline font-extrabold text-[16px] tracking-wider uppercase flex items-center justify-center space-x-2 transition-all primary-shadow cursor-pointer" type="submit">
<span>登录</span>
<span class="material-symbols-outlined text-[19px] transition-transform group-hover:translate-x-0.5">arrow_forward</span>
</button>
<!-- Secondary Action: Token Login Entrance -->
<button class="w-full h-11 rounded-xl bg-surface-container/70 hover:bg-surface-container border border-outline-variant/90 active:scale-[0.98] text-on-surface text-[13px] font-medium font-body flex items-center justify-center space-x-2 transition-all cursor-pointer" type="button">
<span class="material-symbols-outlined text-[#007A87] text-[18px]">vpn_key</span>
<span class="tracking-tight text-on-surface-variant font-semibold">使用已保存的令牌登录</span>
</button>
</div>
</form>
</section>
</div>
<!-- Bottom Safety & Compliance Note (Above Android Nav Line) -->
<footer class="w-full pt-4 pb-2 flex flex-col items-center">
<div class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-surface-container/80 border border-outline-variant/60">
<span class="material-symbols-outlined text-[#007A87] text-[15px]" data-icon="gpp_maybe">shield</span>
<span class="font-body text-[11px] text-on-surface-variant tracking-tight font-medium">
          仅使用本人账号，不收集第三方数据
        </span>
</div>
<!-- Android Virtual Home Pill Indicator Bar -->
<div class="w-32 h-1 bg-on-surface/20 rounded-full mt-4"></div>
</footer>
</main>
<script>
    function handleGetCode(btn) {
      if (btn.disabled) return;
      const phoneInput = document.getElementById('phone-input');
      if (!phoneInput.value || phoneInput.value.length < 11) {
        phoneInput.focus();
        phoneInput.classList.add('animate-pulse');
        setTimeout(() => phoneInput.classList.remove('animate-pulse'), 600);
        return;
      }
      
      let seconds = 60;
      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      const originalText = btn.innerText;
      btn.innerText = `${seconds}s 后重试`;
      
      const timer = setInterval(() => {
        seconds--;
        if (seconds > 0) {
          btn.innerText = `${seconds}s 后重试`;
        } else {
          clearInterval(timer);
          btn.disabled = false;
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
          btn.innerText = originalText;
        }
      }, 1000);
    }
  </script>
</body></html>
