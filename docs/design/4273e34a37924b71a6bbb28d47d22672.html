<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>连接充电桩 - 底部弹窗 (Volt Lime 暗色手机竖屏规范版)</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {

            "on-surface": "#e3e2e4",

            "on-error-container": "#ffdad6",
            "tertiary-fixed-dim": "#5ad7e7",
            "on-tertiary": "#00363c",
            "on-background": "#e3e2e4",

            "primary-container": "#e8e400",
            "on-error": "#690005",
            "surface-container-high": "#292a2c",
            "on-tertiary-fixed-variant": "#004f57",
            "on-primary": "#333200",

            "on-secondary-fixed": "#002114",
            "surface-tint": "#d0cc00",

            "on-tertiary-fixed": "#001f23",
            "secondary-fixed-dim": "#2ce1a0",
            "primary-fixed-dim": "#d0cc00",
            "outline-variant": "#494832",
            "secondary-container": "#00d294",
            "surface-bright": "#38393b",
            "on-surface-variant": "#cac8ab",
            "error-container": "#93000a",
            "error": "#ffb4ab",

<style>
    body {
      background-color: #0E0F11;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .font-tabular {
      font-variant-numeric: tabular-nums;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="w-full h-screen overflow-hidden flex flex-col justify-end select-none bg-[#0E0F11]">
<!-- Pure Mobile Viewport Overlay (dim 0.65) -->
<div class="fixed inset-0 bg-black/65 z-10 w-full h-full pointer-events-auto"></div>
<!-- Docked Bottom Sheet Modal -->
<div class="relative z-20 w-full bg-[#1B1D20] rounded-t-[28px] border-t border-[#2E3035] flex flex-col pt-3 pb-2 shadow-none animate-in fade-in slide-in-from-bottom-8 duration-200">
<!-- Top Drag Handle -->
<div class="w-9 h-1 rounded-full bg-[#33363B] mx-auto mt-1 mb-2.5"></div>
<!-- Modal Header -->
<div class="flex justify-between items-center px-6 pt-1 pb-3">
<h1 class="text-[20px] font-semibold text-[#F5F6F7] font-headline tracking-tight">连接充电桩</h1>
<button aria-label="关闭" class="w-9 h-9 rounded-full bg-[#26282C] border border-[#33363B] flex items-center justify-center text-[#9A9DA3] hover:text-[#F5F6F7] active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="close">close</span>
</button>
</div>
<!-- Charger Info Card (Read-only) -->
<div class="mx-6 rounded-[22px] bg-[#222428] border border-[#33363B] p-4 divide-y divide-[#2E3035]">
<!-- Row 1: 充电桩名称 -->
<div class="py-2.5 flex justify-between items-center">
<span class="text-sm text-[#9A9DA3] font-body">充电桩名称</span>
<span class="text-sm text-[#F5F6F7] font-tabular font-headline">—</span>
</div>
<!-- Row 2: 连接状态 -->
<div class="py-2.5 flex justify-between items-center">
<span class="text-sm text-[#9A9DA3] font-body">连接状态</span>
<div class="flex items-center gap-1.5">
<span class="w-2 h-2 rounded-full bg-[#2BE0A0] inline-block animate-pulse"></span>
<span class="text-sm text-[#F5F6F7] font-body font-medium">已连接</span>
</div>
</div>
<!-- Row 3: 充电桩编号 -->
<div class="py-2.5 flex justify-between items-center">
<span class="text-sm text-[#9A9DA3] font-body">充电桩编号</span>
<span class="text-sm text-[#F5F6F7] font-tabular font-headline">—</span>
</div>
</div>
<!-- Chargeable Status Row -->
<div class="mx-6 mt-3 rounded-[20px] bg-[#26282C] px-4 py-3.5 flex justify-between items-center">
<span class="text-sm text-[#9A9DA3] font-body">可充电状态</span>
<span class="text-sm text-[#F5F6F7] font-semibold font-body tracking-wide">可充电</span>
</div>
<!-- Primary CTA: 启动充电 -->
<button class="mx-6 mt-4 w-[calc(100%-48px)] h-12 py-3 rounded-full bg-[#E8E400] text-[#0E0F11] font-semibold font-headline flex items-center justify-center gap-2 cursor-pointer hover:bg-[#d8d400] active:scale-[0.98] transition-all" type="button">
<span class="material-symbols-outlined text-[20px] leading-none" data-icon="bolt" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-[16px] tracking-tight">启动充电</span>
</button>
<!-- Operational Note -->
<p class="text-xs text-[#6C6F75] font-body text-center mt-3 mb-1">连接后可在车旁启动充电</p>
<!-- System Home Indicator -->
<div class="w-32 h-1 bg-[#4A4D53] rounded-full mx-auto mt-2 mb-1.5"></div>
</div>
</body></html>
