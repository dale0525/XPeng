<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车控快捷指令 - 2x2 桌面小组件 (Volt Lime 亮色)</title>
  <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'BlinkMacSystemFont', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace'],
          },
          colors: {
            widget: {
              card: '#FFFFFF',
              border: '#E5E7EB',
              tile: '#F5F6F8',
              circle: '#EDEDEF',
              text: '#111214',
              accent: '#F4EF00',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 强制去除外部边距与多余背景，精准呈现 320x320 独立小组件卡片 */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
    }
    /* 2x2 Android 小组件本体 */
    .widget-container {
      width: 320px;
      height: 320px;
      background-color: #FFFFFF;
      border-radius: 28px;
      border: 1px solid #E5E7EB;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 1px 3px 0 rgba(0, 0, 0, 0.03);
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      overflow: hidden;
    }
    /* 单个快捷格 */
    .widget-tile {
      background-color: #F5F6F8;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      position: relative;
    }
    .widget-tile:hover {
      background-color: #ECEEEF;
    }
    .widget-tile:active {
      transform: scale(0.96);
      background-color: #E5E7EB;
    }
    /* 图标灰色圆形底座 */
    .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background-color: #EDEDEF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111214;
      margin-bottom: 8px;
      transition: background-color 0.15s ease;
    }
    .widget-tile:active .icon-badge {
      background-color: #DFE1E4;
    }
    /* 标签文字 */
    .tile-label {
      font-size: 13px;
      font-weight: 500;
      color: #111214;
      line-height: 1.2;
      letter-spacing: -0.01em;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Android 2x2 桌面小组件本体 (320px x 320px) -->
  <div class="widget-container" role="region" aria-label="车控快捷操作 2x2 桌面小组件">
    
    <!-- 快捷格 1: 解锁 -->
    <div class="widget-tile" role="button" tabindex="0" aria-label="解锁">
      <div class="icon-badge">
        <span class="material-symbols-outlined">lock_open</span>
      </div>
      <span class="tile-label">解锁</span>
    </div>

    <!-- 快捷格 2: 远程解锁 -->
    <div class="widget-tile" role="button" tabindex="0" aria-label="远程解锁">
      <div class="icon-badge">
        <span class="material-symbols-outlined">vpn_key</span>
      </div>
      <span class="tile-label">远程解锁</span>
    </div>

    <!-- 快捷格 3: 开启空调 -->
    <div class="widget-tile" role="button" tabindex="0" aria-label="开启空调">
      <div class="icon-badge">
        <span class="material-symbols-outlined">ac_unit</span>
      </div>
      <span class="tile-label">开启空调</span>
    </div>

    <!-- 快捷格 4: 闪灯 -->
    <div class="widget-tile" role="button" tabindex="0" aria-label="闪灯">
      <div class="icon-badge">
        <span class="material-symbols-outlined">highlight</span>
      </div>
      <span class="tile-label">闪灯</span>
    </div>

  </div>

</body>
</html>
